name: Generate serie.m3u

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "serie.m3u"
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: m3u-generator-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      # ✅ Miglioria TMDB (evita 429 a raffica)
      - name: Set TMDB rate limit (env)
        run: |
          echo "TMDB_DELAY=0.25" >> $GITHUB_ENV
          echo "TMDB_RETRIES=3" >> $GITHUB_ENV

      - name: Run generator (creates serie.m3u in repo root)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_DELAY: ${{ env.TMDB_DELAY }}
          TMDB_RETRIES: ${{ env.TMDB_RETRIES }}
        run: |
          python scripts/serie.py

      - name: Verify output exists
        run: |
          ls -lah
          test -f serie.m3u && echo "OK: serie.m3u generated in root" || (echo "ERROR: serie.m3u not found" && exit 1)

      # ✅ BLOCCO FIXATO (NO PIÙ ERRORI REBASE)
      - name: Commit and push serie.m3u (SAFE)
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          # Commit solo se serve
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-generate serie.m3u"

          # ✅ FIX VERO: autostash + rebase
          git pull --rebase --autostash origin main

          # Push
          git push origin HEAD:main
