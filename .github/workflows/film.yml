name: Generate film.m3u8

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "film.m3u8"     # evita loop se poi decidi di committare l'output
  # opzionale: schedulato ogni giorno alle 03:15 UTC
  # schedule:
  #   - cron: "15 3 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests python-dotenv
          fi

      - name: Run generator
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python scripts/film.py

      - name: Verify output exists in repo root
        run: |
          ls -lah
          test -f film.m3u8 && echo "OK: film.m3u8 generated" || (echo "ERROR: film.m3u8 not found" && exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: film-m3u8
          path: film.m3u8
``
