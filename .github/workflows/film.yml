name: Generate film.m3u

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    # Evita loop: il commit del bot su film.m3u non rilancia il workflow
    paths-ignore:
      - "film.m3u"
  schedule:
    # 03:00 Italia (CEST) = 01:00 UTC
    - cron: "0 1 * * *"

permissions:
  contents: write

# Concurrency condivisa tra film e serie: niente push concorrenti sul main
concurrency:
  group: m3u-generator-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run generator (creates film.m3u in repo root)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python scripts/film.py

      - name: Verify output exists
        run: |
          ls -lah
          test -f film.m3u && echo "OK: film.m3u generated in root" || (echo "ERROR: film.m3u not found" && exit 1)

      - name: Commit and push film.m3u (rebase-safe)
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add film.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-generate film.m3u"

          # Allineati al remoto (evita rejected: fetch first)
          git fetch origin main
          git rebase
