name: Generate Film M3U8

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # opzionale: ogni giorno alle 03:15 UTC
  # schedule:
  #   - cron: "15 3 * * *"

jobs:
  build-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip
