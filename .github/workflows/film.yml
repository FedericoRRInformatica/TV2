name: Generate film.m3u8

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "film.m3u8"

permissions:
  contents: write

concurrency:
  group: generate-film-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run generator (creates film.m3u8 in repo root)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python scripts/film.py

      - name: Verify output
        run: |
          ls -lah
          test -f film.m3u8 && echo "OK: film.m3u8 generated" || (echo "ERROR: film.m3u8 not found" && exit 1)

      - name: Commit and push film.m3u8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add film.m3u8

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-generate film.m3u8"
          git push
